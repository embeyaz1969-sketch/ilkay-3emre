<!DOCTYPE html><html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ilkay Emre</title><style>
*{box-sizing:border-box}

body{
 margin:0;
 height:100vh;
 overflow:hidden;
 font-family:Arial;
 display:flex;
 justify-content:center;
 align-items:center;
 flex-direction:column;
 background:
 linear-gradient(rgba(255,182,193,.25),rgba(255,182,193,.25)),
 url("IMG-20251117-WA0008.jpg") no-repeat center/cover;
 animation:bgZoom 18s infinite alternate ease-in-out;
}

@keyframes bgZoom{
 from{background-size:100%}
 to{background-size:115%}
}

.overlay{
 position:fixed;
 inset:0;
 backdrop-filter:blur(8px);
 background:rgba(255,182,193,.15);
 z-index:1;
}

.card{
 position:relative;
 z-index:2;
 width:90%;
 max-width:420px;
 padding:45px;
 border-radius:30px;
 text-align:center;
 backdrop-filter:blur(14px);
 background:rgba(255,255,255,.65);
 border:1px solid rgba(255,255,255,.4);
 box-shadow:0 20px 50px rgba(0,0,0,.3);
}

h1{color:#e91e63}
p{font-size:20px}

button{
 margin-top:20px;
 padding:14px 34px;
 font-size:18px;
 border:none;
 border-radius:30px;
 background:#ff69b4;
 color:white;
 cursor:pointer;
 box-shadow:0 0 15px rgba(255,105,180,.7);
 transition:.25s;
}
button:hover{transform:scale(1.08);box-shadow:0 0 25px rgba(255,105,180,1)}
button:active{transform:scale(.95)}

.romantic-text{
 position:relative;
 z-index:999;
 display:flex;
 flex-direction:column;
 align-items:center;
 margin-top:20px;
}

.romantic-line{
 font-size:28px;
 color:#e91e63;
 text-align:center;
 margin-top:18px;
 opacity:0;
 transform:translateY(15px);
 transition:.6s;
}

.romantic-line.show{
 opacity:1;
 transform:translateY(0);
}

.big-final{
 font-size:45px;
 font-weight:bold;
 color:#ff2f92;
 animation:megaGlow 1.6s infinite alternate;
 opacity:1!important;
}

@keyframes megaGlow{
 from{transform:scale(1)}
 to{transform:scale(1.08)}
}

.heart,.fly{
 position:fixed;
 pointer-events:none;
 animation:flyUp 8s linear forwards;
}

@keyframes flyUp{
 from{transform:translateY(0);opacity:1}
 to{transform:translateY(-120vh);opacity:0}
}

.counter{
 margin-top:10px;
 font-size:18px;
 color:#ff2f92;
 font-weight:bold;
}
</style></head><body><div class="overlay"></div><div class="card">
<h1>❤️ GÜZEL KIZIM'A ❤️</h1>
<p>💙19.05.2025💙</p>
<div class="counter" id="counter"></div>
<button onclick="startAll()">👉🏻🤍🫆🤍👈🏻</button>
</div><div class="romantic-text" id="romanticText"></div><audio id="music" src="senden-daha-guzel.mp3" loop></audio>

<script>
let started=false

function updateCounter(){
 const start=new Date("2025-05-19")
 const now=new Date()
 const diff=Math.floor((now-start)/(1000*60*60*24))
 document.getElementById("counter").innerText=diff+" gündür birlikteyiz 🤍"
}
updateCounter()

const romanticLines=[
"Seni sevmek her gün yeniden aşık olmak gibi",
"Gözlerine bakınca dünya susuyor",
"Yanımda olman kalbimin evi gibi",
"İYİ Kİ VARSIN 🤍"
]

function startAll(){
 if(started)return
 started=true
 music.play()

 setInterval(()=>{
  const t=document.createElement("div")
  t.className="fly"
  t.innerText="İLKAY🤍EMRE"
  t.style.left=Math.random()*100+"vw"
  document.body.appendChild(t)
  setTimeout(()=>t.remove(),8000)
 },900)

 startRomanticText()
}

function startRomanticText(){
 const box=document.getElementById("romanticText")
 let i=0
 const interval=setInterval(()=>{
  if(i>=romanticLines.length){
   clearInterval(interval)
   return
  }
  const div=document.createElement("div")
  div.className="romantic-line"+(i===romanticLines.length-1?" big-final":"")
  div.innerHTML=romanticLines[i]
  box.appendChild(div)
  setTimeout(()=>div.classList.add("show"),50)
  i++
 },3500)
}

document.addEventListener("click",e=>{
 for(let i=0;i<8;i++){
  const h=document.createElement("div")
  h.className="heart"
  h.innerText="💖"
  h.style.left=e.clientX+"px"
  h.style.top=e.clientY+"px"
  h.style.fontSize=12+Math.random()*20+"px"
  document.body.appendChild(h)
  setTimeout(()=>h.remove(),3000)
 }
})
</script></body>
</html>
